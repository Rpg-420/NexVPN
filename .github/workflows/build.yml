name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Test Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.3

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend Typecheck (strict)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Go Vet
        run: go vet ./...

      # gofmt is not enforced by vet, and the repo has no formatter hook, so an
      # unformatted file used to reach main unnoticed. .gitattributes pins Go
      # sources to LF so this check cannot be defeated by a CRLF working tree.
      - name: Go Format Check
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Error "These files are not gofmt-clean:`n$files"
            exit 1
          }

      - name: Test Go Packages
        run: go test -race ./...

      - name: Build Windows Binary
        run: wails build -skipbindings -platform windows/amd64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVPN-windows-amd64
          path: build/bin/NexVPN.exe

  build-linux:
    name: Test Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.3

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go Vet
        run: go vet ./...

      # Same guard as the Windows job: .gitattributes keeps this deterministic
      # across platforms, so a formatting regression fails here too.
      - name: Go Format Check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Test Go Packages
        run: go test -race ./...

      - name: Build Linux Binary
        run: wails build -skipbindings -platform linux/amd64 -tags webkit2_41

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVPN-linux-amd64
          path: build/bin/NexVPN

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      # main.go embeds frontend/dist, and dist/ is gitignored, so a Go job that
      # does not build the frontend cannot even type-check: `invalid go:embed:
      # build system did not supply embed configuration`. That single error is
      # what made this job fail for weeks while the real backlog was elsewhere.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned, not `latest`: the gate used to drift every time upstream
          # shipped a release, and the default linter set changed with it.
          # .golangci.yml carries the version-2 config the project is clean
          # against; bump both together.
          version: v2.6.2
          # Report issues without failing the pipeline until the existing
          # backlog is cleared; flip to false to make lint blocking.
          only-new-issues: true
