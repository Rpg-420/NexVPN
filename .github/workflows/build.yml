name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Test Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend Typecheck (strict)
        working-directory: frontend
        run: npx tsc --noEmit

      # The vitest suite (utils, i18n, qrcode, profilePin, backendErrors) only
      # ran locally before — regressions like the empty-QR bug shipped silently.
      - name: Frontend Unit Tests (vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Go Vet
        run: go vet ./...

      # gofmt is not enforced by vet, and the repo has no formatter hook, so an
      # unformatted file used to reach main unnoticed. .gitattributes pins Go
      # sources to LF so this check cannot be defeated by a CRLF working tree.
      - name: Go Format Check
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Error "These files are not gofmt-clean:`n$files"
            exit 1
          }

      - name: Test Go Packages
        run: go test -race ./...

      - name: Build Windows Binary
        run: wails build -skipbindings -platform windows/amd64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVPN-windows-amd64
          path: build/bin/NexVPN.exe

  build-linux:
    name: Test Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend Unit Tests (vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Go Vet
        run: go vet ./...

      # Same guard as the Windows job: .gitattributes keeps this deterministic
      # across platforms, so a formatting regression fails here too.
      - name: Go Format Check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Test Go Packages
        run: go test -race ./...

      - name: Build Linux Binary
        run: wails build -skipbindings -platform linux/amd64 -tags webkit2_41

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVPN-linux-amd64
          path: build/bin/NexVPN

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — golangci-lint-action is configured with
      # `only-new-issues: true`, which diffs the branch against its base. On a
      # default shallow checkout (depth 1) the base commit is not present, the
      # action cannot compute the range, and golangci-lint exits with code 3
      # ("failure", no issue list) — which is exactly how this job failed on
      # every branch, including dependabot bumps that touch nothing else.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      # main.go embeds frontend/dist, and dist/ is gitignored, so a Go job that
      # does not build the frontend cannot even type-check: `invalid go:embed:
      # build system did not supply embed configuration`. That single error is
      # what made this job fail for weeks while the real backlog was elsewhere.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: golangci-lint
        # v7 is required for golangci-lint v2; v6 rejects any v2 version
        # string with "golangci-lint v2 is not supported by golangci-lint-action v6".
        uses: golangci/golangci-lint-action@v7
        with:
          # v2.15.0, not v2.6.2: the older build cannot decode Go 1.27 export
          # data ("export data version 5 is greater than maximum supported
          # version 2"), so the job aborted with exit code 3 before reporting a
          # single issue — on every branch, including dependabot version bumps.
          # Pinned, not `latest`: the gate must not drift under us, and
          # .golangci.yml carries the version-2 config the project is clean
          # against; bump both together.
          version: v2.15.0
          # Blocking now: the backlog this used to skip is gone — v2.15.0
          # reports "0 issues" over ./... with this config, so any future
          # finding is a regression this job should stop.
          only-new-issues: false
