<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنمای کاربری | مستندات رسمی NexVPN Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'Inter', 'sans-serif'] },
                    colors: {
                        dark: { 950: '#030712', 900: '#0B0F19', 800: '#111827' },
                        cyan: { 400: '#22D3EE', 500: '#00F0FF' },
                        purple: { 400: '#C084FC', 500: '#A855F7' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030712; color: #E5E7EB; font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(11, 15, 25, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        #content h1 { font-size: 2.25rem; font-weight: 900; margin-bottom: 1.5rem; color: #FFFFFF; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.75rem; }
        #content h2 { font-size: 1.6rem; font-weight: 800; margin-top: 2.5rem; margin-bottom: 1rem; color: #00F0FF; }
        #content h3 { font-size: 1.25rem; font-weight: 700; margin-top: 1.75rem; margin-bottom: 0.75rem; color: #C084FC; }
        #content p { margin-bottom: 1.25rem; line-height: 1.9; color: #D1D5DB; font-size: 0.95rem; }
        #content ul, #content ol { margin-bottom: 1.25rem; list-style-type: disc; margin-right: 1.5rem; }
        #content li { margin-bottom: 0.5rem; color: #D1D5DB; font-size: 0.95rem; }
        #content a { color: #00F0FF; text-decoration: underline; text-underline-offset: 4px; }
        #content a:hover { color: #A855F7; }
        #content pre { background: #0B0F19; padding: 1.25rem; border-radius: 0.75rem; overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.1); direction: ltr; text-align: left; }
        #content code { font-family: monospace; font-size: 0.85em; background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.3rem; color: #00F0FF; direction: ltr; display: inline-block; }
        #content pre code { background: transparent; padding: 0; color: #E5E7EB; display: block; }
        #content table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        #content th, #content td { border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; text-align: right; font-size: 0.875rem; }
        #content th { background: rgba(255,255,255,0.05); color: #00F0FF; }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <nav class="fixed w-full z-50 glass border-b border-white/10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2 font-bold text-sm text-gray-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-right text-cyan-400"></i> بازگشت به صفحه اصلی
                </a>
                <div class="flex items-center gap-4">
                    <a href="user-guide-en.html" class="text-xs font-semibold text-gray-400 hover:text-cyan-400 transition">🇬🇧 English Version</a>
                    <span class="font-bold text-sm bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-400">
                        راهنمای کاربری نکس‌وی‌پی‌ان
                    </span>
                </div>
            </div>
        </div>
    </nav>
    <main class="pt-28 pb-20 min-h-screen">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="glass-panel p-8 sm:p-12 rounded-3xl shadow-2xl">
                <div id="content" class="animate-pulse">در حال بارگذاری راهنمای فارسی...</div>
            </div>
        </div>
    </main>
    
    <script>
        fetch('USER_GUIDE_FA.md')
            .then(res => res.text())
            .then(md => {
                document.getElementById('content').classList.remove('animate-pulse');
                document.getElementById('content').innerHTML = marked.parse(md);
            })
            .catch(() => {
                document.getElementById('content').innerHTML = '<h1>امکان بارگذاری مستندات فراهم نشد.</h1>';
            });
    </script>
</body>
</html>
